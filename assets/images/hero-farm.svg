<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Stylised poultry farm illustration (vector graphic, not a project photo) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2A20"/>
      <stop offset="1" stop-color="#1A5A3F"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#218B5A"/>
      <stop offset="1" stop-color="#14533A"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17694A"/>
      <stop offset="1" stop-color="#0E3D2C"/>
