  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1240" cy="230" r="90" fill="#B6E36A" opacity=".18"/>
  <circle cx="1240" cy="230" r="54" fill="#B6E36A" opacity=".35"/>
  <path d="M0 560 C300 470 520 520 800 500 S1300 430 1600 480 V900 H0Z" fill="url(#hill2)"/>
