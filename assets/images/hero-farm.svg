    <rect x="1030" y="490" width="26" height="16" rx="3"/><rect x="1080" y="490" width="26" height="16" rx="3"/>
    <rect x="1130" y="490" width="26" height="16" rx="3"/><rect x="1180" y="490" width="26" height="16" rx="3"/>
    <rect x="1230" y="490" width="26" height="16" rx="3"/><rect x="1280" y="490" width="26" height="16" rx="3"/>
    <rect x="1330" y="490" width="26" height="16" rx="3"/>
    <rect x="560" y="515" width="22" height="13" rx="3"/><rect x="600" y="515" width="22" height="13" rx="3"/>
    <rect x="640" y="515" width="22" height="13" rx="3"/><rect x="680" y="515" width="22" height="13" rx="3"/>
    <rect x="720" y="515" width="22" height="13" rx="3"/><rect x="760" y="515" width="22" height="13" rx="3"/>
    <rect x="800" y="515" width="22" height="13" rx="3"/><rect x="840" y="515" width="22" height="13" rx="3"/>
